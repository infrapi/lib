site_name: infrapi/lib
site_description: Opinionated Go building blocks for InfraPI services - dotenv configuration, HTTP client, gin server.
site_url: https://infrapi.github.io/lib/
repo_url: https://github.com/infrapi/lib
repo_name: infrapi/lib
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Geist
    code: Geist Mono

extra_css:
  - assets/stylesheets/theme.css

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      # keeps `mkdocs build` working on files that are not committed yet
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Packages:
      - config: packages/config.md
      - http: packages/http.md
      - server: packages/server.md
  - Development: development.md
