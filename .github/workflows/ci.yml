# lib's CI, a library: no binary, no image; its release is the tag.
# infrapi/ci's Go workflow: the checks on a push or a pull request; on a push
# to main, go-semantic-release makes the version and the GitHub release from
# the conventional commits; the portal (infrapi/docs) and the org profile
# (infrapi/.github) are told after a release, a change to docs/ or a manual
# run. Its inputs: https://github.com/infrapi/ci
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    uses: infrapi/ci/.github/workflows/go.yml@v1
    permissions:
      contents: write   # the tag and the release
    with:
      release: semantic
      goreleaser: false
      notify-docs: true
    secrets: inherit
