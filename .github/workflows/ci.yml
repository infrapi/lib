name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # pkg/cluster and examples/cluster are modules of their own, and the
          # dskit tree they pull is large enough that missing it from the cache
          # key costs minutes on every run.
          cache-dependency-path: |
            go.sum
            pkg/cluster/go.sum
            examples/cluster/go.sum

      - name: Install lint and security tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Format
        run: make fmt

      - name: Check formatting
        run: git diff --exit-code

      - name: Lint
        run: make lint

      - name: Security
        run: make security

      - name: Test
        run: make test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true

      - uses: actions/setup-go@v7
        if: steps.semrel.outputs.version != ''
        with:
          go-version-file: go.mod

      # Each submodule requires its siblings at the version it is released
      # with: pkg/cluster vX needs the library's vX. The in-repo
      # replace directives hide a stale require while building here, and a
      # consumer, who does not get them, would ask for a version that does not
      # exist. The submodule tags below go on this commit.
      - name: Point the submodules at this release
        if: steps.semrel.outputs.version != ''
        run: |
          v="v${{ steps.semrel.outputs.version }}"
          lib=github.com/infrapi/lib
          (cd pkg/cluster && go mod edit -require=$lib@$v)
          (cd examples/cluster && go mod edit -require=$lib@$v -require=$lib/pkg/cluster@$v)
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): submodules require $v [skip ci]"
          git push origin HEAD:main

      # The module proxy resolves github.com/infrapi/lib/pkg/cluster@vX.Y.Z from
      # a tag literally named pkg/cluster/vX.Y.Z, which go-semantic-release does
      # not create. The submodules are versioned in lockstep with the library
      # because they cannot build without the matching pkg/config, so one
      # version number is the honest description of the pair.
      - name: Tag the submodules in lockstep
        if: steps.semrel.outputs.version != ''
        run: |
          for module in pkg/cluster examples/cluster; do
            tag="$module/v${{ steps.semrel.outputs.version }}"
            git tag "$tag"
            git push origin "$tag"
          done
