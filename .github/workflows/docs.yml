name: Docs

on:
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - README.md
      - docs/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - mkdocs.yml
      - README.md
      - docs/**
      - .github/workflows/docs.yml

permissions:
  contents: read

# Only one Pages deployment at a time; a newer push wins rather than queuing
# behind an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs on every push and PR so a broken link or page (--strict) fails the
  # build before it ever reaches main.
  build:
    runs-on: ubuntu-latest
    steps:
      # git-revision-date-localized reads the full history to date each page
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material pymdown-extensions mkdocs-git-revision-date-localized-plugin

      - name: Build
        run: mkdocs build --strict --verbose

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Only on main: publishes the artifact the build job uploaded. Requires
  # Settings > Pages > Source = "GitHub Actions".
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
