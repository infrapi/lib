name: Docs

on:
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - README.md
      - docs/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - mkdocs.yml
      - README.md
      - docs/**
      - .github/workflows/docs.yml

# Builds the site to keep the docs valid (--strict fails on a broken link or
# page). Not deployed: GitHub Pages is not enabled on this repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # git-revision-date-localized reads the full history to date each page
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material pymdown-extensions mkdocs-git-revision-date-localized-plugin

      - name: Build
        run: mkdocs build --strict --verbose
