# etcd for the etcd-*.env variants, in the same shape as
# examples/gateway/compose.yaml so podman has nothing new to pull.
#
#   podman compose up -d        # or: podman-compose up -d
#   podman compose down -v      # -v also drops the data volume
#
# Rootless podman notes:
#   - the image is fully qualified, because rootless podman does not guess a
#     registry and will not pull from a short name;
#   - `user: root` is the container's root, which is your own user on the host
#     under rootless, not a privilege escalation;
#   - a volume mount would carry ,z so SELinux relabels it shared — :z and not
#     :Z, which labels content private to one container and breaks anything
#     else reading the path.
#
# Only one of these may be up at a time per machine: it binds 2379.
services:
  etcd:
    image: docker.io/bitnamilegacy/etcd:3.4.9
    user: root
    restart: always
    volumes:
      - etcd_data:/etcd_data
    environment:
      ETCD_DATA_DIR: /etcd_data
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://127.0.0.1:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379/tcp"

volumes:
  etcd_data:
