# The example's configuration: the library's keys in the app and cluster
# sections, the service's own under service. Every INFRAPI_APP_* and
# INFRAPI_CLUSTER_* variable overrides the file.
app:
  platform: sandbox
  region: eu-west-1
  location: dc1
  url: http://localhost:8080
  fqdn: orders.localhost.localdomain
  listen_address: 127.0.0.1:8080
  log_format: text
shutdown:
  drain_delay: 0s
service:
  max_quantity: 10
